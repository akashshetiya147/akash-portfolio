<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Akash Shetiya Resume"
    >

    <title>Akash Shetiya | Resume</title>


    <!-- RESUME PAGE LOGO -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23030508'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Arial' font-size='40' font-weight='900' fill='%2300d9ff'%3EAS%3C/text%3E%3C/svg%3E"
    >


    <style>


        * {

            box-sizing:
                border-box;

        }


        html,
        body {

            margin:
                0;

            padding:
                0;

            width:
                100%;

            height:
                100%;

            background:
                #111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            overflow:
                hidden;

        }


        /* =================================================
           TOP BAR
        ================================================= */

        .topbar {

            width:
                100%;

            height:
                64px;

            padding:
                0 20px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            background:
                #07111f;

            border-bottom:
                1px solid
                #1c3347;

        }


        .title {

            color:
                #00d9ff;

            font-size:
                15px;

            font-weight:
                700;

            letter-spacing:
                1.5px;

        }


        .buttons {

            display:
                flex;

            gap:
                10px;

        }


        .btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                10px 15px;

            text-decoration:
                none;

            font-size:
                10px;

            font-weight:
                700;

            letter-spacing:
                1px;

            border:
                1px solid
                #00d9ff;

            color:
                #00d9ff;

            background:
                transparent;

            transition:
                .25s;

        }


        .btn:hover {

            background:
                #00d9ff;

            color:
                #000;

        }


        /* =================================================
           PDF
        ================================================= */

        .viewer {

            width:
                100%;

            height:
                calc(100vh - 64px);

            background:
                #222;

        }


        iframe {

            width:
                100%;

            height:
                100%;

            border:
                none;

            display:
                block;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width:700px) {


            .topbar {

                height:
                    60px;

                padding:
                    0 12px;

            }


            .title {

                font-size:
                    11px;

                letter-spacing:
                    1px;

            }


            .buttons {

                gap:
                    5px;

            }


            .btn {

                padding:
                    8px 9px;

                font-size:
                    8px;

            }


            .viewer {

                height:
                    calc(100vh - 60px);

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     RESUME HEADER
===================================================== -->

<div class="topbar">


    <div class="title">

        AKASH SHETIYA — RESUME

    </div>


    <div class="buttons">


        <a
            class="btn"
            href="assets/Akash_Shetiya_Resume.pdf"
            download>

            DOWNLOAD

        </a>


        <a
            class="btn"
            href="assets/Akash_Shetiya_Resume.pdf"
            target="_blank"
            rel="noopener noreferrer">

            OPEN PDF ↗

        </a>


    </div>


</div>



<!-- =====================================================
     PDF VIEWER
===================================================== -->

<div class="viewer">


    <iframe
        src="assets/Akash_Shetiya_Resume.pdf"
        title="Akash Shetiya Resume">

    </iframe>


</div>


</body>

</html>
